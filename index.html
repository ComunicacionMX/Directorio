<html lang="es">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Directorio Staff HU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #6d597a;
    --navy-soft: #2C74E0;
    --gold: #eaac8b;
    --gold-light: #f0d98d;
    --bg: #F4F6FB;
    --surface: #FFFFFF;
    --text: #1A202C;
    --muted: #718096;
    --border: #E2E8F0;
    --radius: 12px;
  }

  html{scroll-behavior:smooth;}
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .site-header {
    background: var(--navy);
    background-image: linear-gradient(160deg, var(--navy) 0%, var(--navy-soft) 100%);
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(13,27,42,.4);
  }

  .header-inner {
    max-width: 1300px;
    margin: 0 auto;
    padding: 24px 32px 20px;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-mark {
    width: 48px; height: 48px;
    background: var(--gold);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 17px; color: var(--navy);
    letter-spacing: -1px;
    flex: none;
  }

  .brand-text h1 {
    font-size: 22px; font-weight: 700;
    color: #FFFFFF;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  .brand-text p {
    font-size: 12px; color: #8899AA;
    margin-top: 3px; letter-spacing: .5px; text-transform: uppercase;
  }

  .stats {
    display: flex; gap: 10px;
  }

  .stat-pill {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(201,168,76,.3);
    border-radius: 100px;
    padding: 8px 18px;
    text-align: center;
  }

  .stat-pill .num {
    display: block; font-size: 19px; font-weight: 700; color: var(--gold);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .stat-pill .lbl {
    display: block; font-size: 9.5px; color: #8899AA;
    text-transform: uppercase; letter-spacing: .5px; margin-top: 3px;
  }

  /* ── SEARCH ── */
  .search-wrap {
    margin-top: 16px;
    position: relative;
  }

  .search-wrap input {
    width: 100%; padding: 12px 44px 12px 46px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    color: white; font-size: 14px; outline: none;
    font-family: 'Inter', sans-serif;
    transition: border-color .2s, background .2s;
  }

  .search-wrap input::placeholder { color: #607080; }
  .search-wrap input:focus {
    border-color: var(--gold);
    background: rgba(255,255,255,0.1);
  }

  .search-icon {
    position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
    font-size: 16px; pointer-events: none;
    opacity: .8;
  }

  .clear-icon{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    width:24px; height:24px; border-radius:50%; border:none;
    background:transparent; color:#8899AA; cursor:pointer;
    display:none; align-items:center; justify-content:center; font-size:15px;
  }
  .clear-icon:hover{background:rgba(255,255,255,0.12); color:#fff;}

  /* ── FILTER PILLS ── */
  .filter-bar {
    max-width: 1300px; margin: 24px auto 0;
    padding: 0 32px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }

  .filter-pill {
    display:inline-flex; align-items:center; gap:6px;
    padding: 6px 14px; border-radius: 100px;
    font-size: 12px; font-weight: 500;
    border: 1.5px solid var(--border);
    background: var(--surface); color: var(--muted);
    cursor: pointer; transition: all .15s;
    white-space: nowrap;
    font-family:'Inter',sans-serif;
  }

  .filter-pill:hover { border-color: var(--gold); color: var(--navy); }
  .filter-pill.active { background: var(--navy); color: white; border-color: var(--navy); }
  .filter-pill .n{opacity:.65; font-size:10.5px;}

  /* ── MAIN ── */
  .main {
    max-width: 1300px; margin: 32px auto 48px;
    padding: 0 32px;
    display: flex; flex-direction: column; gap: 28px;
  }

  /* ── AREA SECTION ── */
  .area-section { background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .area-section.hidden{display:none;}

  .area-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px;
    flex-wrap: wrap; gap: 10px;
  }

  .area-title {
    display: flex; align-items: center; gap: 10px;
  }

  .area-icon { font-size: 20px; }

  .area-header h2 {
    font-size: 15px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px;
  }

  .badge {
    color: white; font-size: 11px; font-weight: 600;
    padding: 4px 12px; border-radius: 100px;
    white-space: nowrap;
  }

  /* ── TABLE ── */
  .table-wrap { overflow-x: auto; }

  table {
    width: 100%; border-collapse: collapse;
    font-size: 13px;
  }

  thead th {
    background: #F7F9FC;
    color: var(--muted); font-weight: 600;
    font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    text-align: left;
  }

  .contact-row { transition: background .15s; }
  .contact-row.hidden{display:none;}
  .contact-row:hover { background: #F0F4FF; }

  .contact-row td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  .contact-row:last-child td { border-bottom: none; }

  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: white;
    flex-shrink: 0;
    font-family:'Inter',sans-serif;
  }

  .nombre { font-weight: 600; color: var(--text); }
  .rol { color: var(--muted); font-size: 12px; }

  .contact-link {
    color: #2B6CB0; text-decoration: none; font-size: 12px;
    white-space: nowrap;
    transition: color .15s;
  }
  .contact-link:hover { color: var(--gold); text-decoration: underline; }

  .no-data { color: #CBD5E0; }

  .dept {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: .2px;
  }

  mark{
    background: rgba(201,168,76,.35);
    color: inherit;
    border-radius: 3px;
    padding: 0 1px;
  }

  #empty-state{
    display:none;
    text-align:center;
    padding: 70px 20px;
    color: var(--muted);
  }
  #empty-state .glyph{ font-size: 30px; margin-bottom: 10px; }
  #empty-state p{ font-size: 14px; margin: 4px 0; }
  #empty-state .hint{ font-size: 12.5px; color: #A0AEC0; }

  footer{
    text-align:center;
    padding: 0 20px 40px;
    color: #A0AEC0;
    font-size: 11.5px;
  }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
    .header-inner, .filter-bar, .main { padding: 0 16px; }
    .header-inner{padding-top:18px; padding-bottom:16px;}
    .stats { gap: 8px; }
    .stat-pill{padding:6px 12px;}
    .stat-pill .num { font-size: 15px; }
    .brand-text h1{font-size:19px;}
    table{ font-size: 12.5px; min-width: 640px; }

    .table-wrap{
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    .table-wrap::after{
      content:"";
      position:absolute; top:0; right:0; bottom:0; width:22px;
      background:linear-gradient(90deg, transparent, rgba(0,0,0,.06));
      pointer-events:none;
    }
    
  }
</style>
</head>

const AREA_META = {
  "DIRECCIÓN":                    { color:"#E0A800", icon:"🏢" },
  "ARQUITECTURA Y MANTENIMIENTO": { color:"#1B4F72", icon:"🏗️" },
  "BRAND MANAGEMENT":             { color:"#6C3483", icon:"🎨" },
  "CAPITAL HUMANO":                { color:"#1E8449", icon:"👥" },
  "CUSTOMER EXPERIENCE":          { color:"#D35400", icon:"⭐" },
  "E-COMMERCE":                   { color:"#117A65", icon:"🛒" },
  "FINANZAS Y SERVICIOS":         { color:"#1A5276", icon:"💼" },
  "LOCACIONES":                   { color:"#784212", icon:"📍" },
  "OPERACIONES RETAIL":           { color:"#4A235A", icon:"🏪" },
  "SUPPLY CHAIN":                 { color:"#0E6655", icon:"🚚" }
};

const AREA_ORDER = [
  "DIRECCIÓN","FINANZAS Y SERVICIOS","CAPITAL HUMANO","OPERACIONES RETAIL",
  "BRAND MANAGEMENT","ARQUITECTURA Y MANTENIMIENTO","SUPPLY CHAIN","LOCACIONES",
  "CUSTOMER EXPERIENCE","E-COMMERCE"
];

const mainEl = document.getElementById('mainContent');
const filterBar = document.getElementById('filterBar');
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearSearch');
const emptyState = document.getElementById('empty-state');

let activeArea = 'all';
let query = '';

function titleCase(s){
  return s.split(' ').map(w => w.length <= 2 ? w.toLowerCase() : w.charAt(0)+w.slice(1).toLowerCase()).join(' ')
    .replace(/^./, c => c.toUpperCase());
}

function initials(name){
  const parts = name.trim().split(/\s+/);
  const first = parts[0]?.[0] || '';
  const last = parts.length > 1 ? parts[parts.length-1][0] : (parts[0]?.[1] || '');
  return (first + last).toUpperCase();
}

function formatPhone(tl){
  if(!tl) return '';
  const d = tl.replace(/\D/g,'');
  if(d.length === 10) return `${d.slice(0,2)} ${d.slice(2,6)} ${d.slice(6)}`;
  return tl;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight(text, q){
  if(!q) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + '<mark>' + escapeHtml(text.slice(idx, idx+q.length)) + '</mark>' + escapeHtml(text.slice(idx+q.length));
}

function buildStats(){
  document.getElementById('stat-total').textContent = DATA.length;
  document.getElementById('stat-areas').textContent = new Set(DATA.map(d=>d.ar)).size;
  document.getElementById('stat-phone').textContent = DATA.filter(d=>d.tl).length;
}

function buildFilterBar(){
  const counts = {};
  DATA.forEach(d => counts[d.ar] = (counts[d.ar]||0)+1);

  const allBtn = document.createElement('button');
  allBtn.className = 'filter-pill active';
  allBtn.dataset.filter = 'all';
  allBtn.innerHTML = `Todas las áreas <span class="n">${DATA.length}</span>`;
  filterBar.appendChild(allBtn);

  AREA_ORDER.filter(a => counts[a]).forEach(area => {
    const meta = AREA_META[area];
    const btn = document.createElement('button');
    btn.className = 'filter-pill';
    btn.dataset.filter = area;
    btn.innerHTML = `${titleCase(area)} <span class="n">${counts[area]}</span>`;
    filterBar.appendChild(btn);
  });

  filterBar.addEventListener('click', e => {
    const pill = e.target.closest('.filter-pill');
    if(!pill) return;
    activeArea = pill.dataset.filter;
    [...filterBar.children].forEach(p => p.classList.toggle('active', p === pill));
    render();
  });
}

function buildSections(){
  const byArea = {};
  DATA.forEach(d => (byArea[d.ar] = byArea[d.ar] || []).push(d));

  AREA_ORDER.filter(a => byArea[a]).forEach(area => {
    const meta = AREA_META[area];
    const people = byArea[area];

    const section = document.createElement('section');
    section.className = 'area-section';
    section.dataset.area = area;

    section.innerHTML = `
      <div class="area-header" style="border-left:5px solid ${meta.color}; background:linear-gradient(135deg, ${meta.color}18 0%, transparent 100%);">
        <div class="area-title">
          <span class="area-icon">${meta.icon}</span>
          <h2 style="color:${meta.color}">${titleCase(area)}</h2>
        </div>
        <span class="badge" style="background:${meta.color}">${people.length} contactos</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Departamento</th>
              <th>Rol</th>
              <th>Correo</th>
              <th>Teléfono</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    `;

    const tbody = section.querySelector('tbody');
    people.forEach(d => {
      const tr = document.createElement('tr');
      tr.className = 'contact-row';
      tr.dataset.search = [d.nm, d.ps, d.dp || area, d.em, d.tl].join(' ').toLowerCase();

      const phoneCell = d.tl
        ? `<a class="contact-link" href="tel:+52${d.tl}">📞 ${formatPhone(d.tl)}</a>`
        : `<span class="no-data">—</span>`;

      tr.innerHTML = `
        <td><span class="nombre">${d.nm}</span></td>
        <td><span class="dept">${titleCase(d.dp || area)}</span></td>
        <td><span class="rol">${d.ps}</span></td>
        <td><a class="contact-link" href="mailto:${d.em}">✉️ ${d.em}</a></td>
        <td>${phoneCell}</td>
      `;
      tbody.appendChild(tr);
    });

    mainEl.appendChild(section);
  });
}

function render(){
  const q = query.trim().toLowerCase();
  let anySectionVisible = false;

  document.querySelectorAll('.area-section').forEach(section => {
    const area = section.dataset.area;
    const areaMatch = activeArea === 'all' || activeArea === area;
    if(!areaMatch){ section.classList.add('hidden'); return; }

    let anyRowVisible = false;
    section.querySelectorAll('.contact-row').forEach(row => {
      const match = !q || row.dataset.search.includes(q);
      row.classList.toggle('hidden', !match);
      if(match) anyRowVisible = true;
    });

    section.classList.toggle('hidden', !anyRowVisible);
    if(anyRowVisible) anySectionVisible = true;
  });

  emptyState.style.display = anySectionVisible ? 'none' : 'block';
}

buildStats();
buildFilterBar();
buildSections();
render();

searchInput.addEventListener('input', e => {
  query = e.target.value;
  clearBtn.style.display = query ? 'flex' : 'none';
  render();
});
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  query = '';
  clearBtn.style.display = 'none';
  searchInput.focus();
  render();
});
</script>
